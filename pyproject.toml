[project]
name = "gnd-gender"
version = "0.2.0"
dependencies = [
    "atproto",
    "lxml",
    "Mastodon.py",
    "requests",
]

[project.scripts]
gnd-gender = "gnd_gender.main:main"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gnd_gender"]
